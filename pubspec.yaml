name: pocket_ai
description: Pocket AI — a voice-first Android AI assistant. Wake word "Piti".
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  speech_to_text: ^7.5.0
  audioplayers: ^6.8.1
  permission_handler: ^13.0.2
  porcupine_flutter: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/porcupine/
